name: CI/CD - Deploy Python Service to Cloud Run

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  PROJECT_ID: probestack-e2068
  SERVICE_ACCOUNT_EMAIL: github-actions-deployer@probestack-e2068.iam.gserviceaccount.com
  SERVICE_NAME: admin-backend
  REGION: us-central1
  PYTHON_VERSION: '3.11'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🐍 Python instead of Java
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          pytest || true

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}

          IMAGE_TAG=${{ github.sha }}
          IMAGE_NAME=gcr.io/${{ env.PROJECT_ID }}/admin-backend

          echo "Building Docker image: ${IMAGE_NAME}:${IMAGE_TAG}"
          docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:${BRANCH_NAME} .

          if [ "$BRANCH_NAME" = "main" ]; then
            docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest
          fi

          docker push ${IMAGE_NAME}:${IMAGE_TAG}
          docker push ${IMAGE_NAME}:${BRANCH_NAME}

          if [ "$BRANCH_NAME" = "main" ]; then
            docker push ${IMAGE_NAME}:latest
          fi

      - name: Deploy to Cloud Run
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}

          if [ "$BRANCH_NAME" = "main" ]; then
            DEPLOY_SERVICE_NAME=admin-backend
          else
            DEPLOY_SERVICE_NAME=admin-backend-${BRANCH_NAME}
          fi

          echo "Deploying service: ${DEPLOY_SERVICE_NAME}"

          gcloud run deploy ${DEPLOY_SERVICE_NAME} \
            --image=gcr.io/${{ env.PROJECT_ID }}/admin-backend:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300 \
            --concurrency=80 \
            --quiet

      - name: Get Service URL
        id: service-url
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}

          if [ "$BRANCH_NAME" = "main" ]; then
            DEPLOY_SERVICE_NAME=admin-backend
          else
            DEPLOY_SERVICE_NAME=admin-backend-${BRANCH_NAME}
          fi

          SERVICE_URL=$(gcloud run services describe ${DEPLOY_SERVICE_NAME} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')

          echo "url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "Service URL: ${SERVICE_URL}"

      - name: Health Check
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BRANCH_NAME=${BRANCH_NAME//\//-}

          if [ "$BRANCH_NAME" = "main" ]; then
            DEPLOY_SERVICE_NAME=admin-backend
          else
            DEPLOY_SERVICE_NAME=admin-backend-${BRANCH_NAME}
          fi

          SERVICE_URL=$(gcloud run services describe ${DEPLOY_SERVICE_NAME} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')

          echo "Waiting for service..."
          sleep 10

          # Adjust this endpoint if needed
          curl -f ${SERVICE_URL}/health || exit 1
